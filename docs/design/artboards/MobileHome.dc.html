<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>알짜 홈 모바일</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#17201b;text-decoration:none}
a:hover{color:#0b6e4f}
@media (prefers-reduced-motion: reduce){.search-panel{transition:none !important}}
</style>
</helmet>
<div style="width: 390px; min-height: 2070px; box-sizing: border-box; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #17201b; background: #ffffff; display: flex; flex-direction: column">
  <header style="border-bottom: 1px solid #e3e7e4">
    <div style="height: 56px; display: flex; align-items: center; justify-content: center">
      <a href="MobileHome.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px" aria-label="알짜 홈">
        <span style="width: 26px; height: 26px; border-radius: 7px; background: #0b6e4f; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">알</span>
        <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.02em">알짜</span>
      </a>
    </div>
    <nav aria-label="카테고리" style="border-top: 1px solid #eef1ef; display: flex; align-items: center">
      <div style="flex: 1; min-width: 0; overflow-x: auto; padding-left: 44px">
      <ul style="list-style: none; margin: 0 auto; padding: 0 4px; display: flex; white-space: nowrap; width: max-content">
        <li><a href="MobileHome.dc.html" aria-current="page" style="display: block; padding: 12px 12px; font-size: 15px; font-weight: 700; color: #0b6e4f; box-shadow: inset 0 -2px 0 #0b6e4f">전체</a></li>
        <li><a href="#" style="display: block; padding: 12px 12px; font-size: 15px; color: #4a554e">생활</a></li>
        <li><a href="#" style="display: block; padding: 12px 12px; font-size: 15px; color: #4a554e">돈</a></li>
        <li><a href="MobileCategory.dc.html" style="display: block; padding: 12px 12px; font-size: 15px; color: #4a554e">행정</a></li>
      </ul>
      </div>
      <button type="button" onClick="{{toggleSearch}}" aria-expanded="{{searchExpanded}}" aria-controls="m-site-search" aria-label="{{searchLabel}}" style="flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 8px; background: {{searchBtnBg}}; color: #17201b; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <sc-if value="{{searchClosed}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></sc-if>
        <sc-if value="{{searchOpen}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
      </button>
    </nav>
    <div id="m-site-search" class="search-panel" style="display: grid; grid-template-rows: {{panelRows}}; opacity: {{panelOpacity}}; visibility: {{panelVis}}; transition: grid-template-rows 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease, visibility 0.3s">
      <div style="overflow: hidden; min-height: 0">
      <div style="border-top: 1px solid #eef1ef; background: #f6f8f6; padding: 12px 16px">
        <label for="m-site-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">검색어</label>
        <div style="position: relative">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b665f" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 14px; top: 15px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input id="m-site-q" type="search" placeholder="검색어를 입력하세요" style="width: 100%; box-sizing: border-box; height: 48px; padding: 0 14px 0 40px; font-family: inherit; font-size: 16px; color: #17201b; border: 1.5px solid #17201b; border-radius: 10px; background: #ffffff">
        </div>
      </div>
      </div>
    </div>
  </header>

  <main style="flex: 1; padding: 32px 16px 24px">
    <p style="margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #0b6e4f">생활 · 돈 · 행정</p>
    <p style="margin: 0 0 28px; font-size: 21px; line-height: 1.45; font-weight: 700; letter-spacing: -0.015em">알아두면 쓸모있는 정보</p>

    <ol style="list-style: none; margin: 0; padding: 0; border-top: 1px solid #17201b">
      <sc-for list="{{posts}}" as="p" hint-placeholder-count="10">
        <li style="padding: 20px 0; border-bottom: 1px solid #e3e7e4; display: flex; flex-direction: column; gap: 6px">
          <p style="margin: 0; font-size: 13px; color: #5b665f">{{p.date}} · {{p.cat}}</p>
          <a href="MobilePost.dc.html" style="font-size: 17px; line-height: 1.5; font-weight: 700">{{p.title}}</a>
          <p style="margin: 0; font-size: 15px; line-height: 1.65; color: #4a554e">{{p.desc}}</p>
        </li>
      </sc-for>
    </ol>

    <nav aria-label="페이지 이동" style="display: flex; align-items: center; justify-content: center; gap: 2px; padding-top: 28px; font-size: 15px">
      <sc-if value="{{hasPrev}}" hint-placeholder-val="{{ false }}">
        <a href="#" onClick="{{goPrev}}" aria-label="이전 페이지" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 8px; color: #17201b"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></a>
      </sc-if>
      <sc-if value="{{noPrev}}" hint-placeholder-val="{{ true }}">
        <span aria-disabled="true" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #b4bcb7"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></span>
      </sc-if>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; gap: 2px">
        <sc-for list="{{pages}}" as="pg" hint-placeholder-count="5">
          <li>
            <sc-if value="{{pg.isCur}}" hint-placeholder-val="{{ false }}">
              <span aria-current="page" style="display: flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; border-radius: 8px; background: #0b6e4f; color: #ffffff; font-weight: 700">{{pg.label}}</span>
            </sc-if>
            <sc-if value="{{pg.isLink}}" hint-placeholder-val="{{ true }}">
              <a href="#" onClick="{{pg.go}}" aria-label="{{pg.aria}}" style="display: flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; border-radius: 8px; color: #17201b">{{pg.label}}</a>
            </sc-if>
            <sc-if value="{{pg.isGap}}" hint-placeholder-val="{{ false }}">
              <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; min-width: 24px; height: 44px; color: #5b665f">…</span>
            </sc-if>
          </li>
        </sc-for>
      </ol>
      <sc-if value="{{hasNext}}" hint-placeholder-val="{{ true }}">
        <a href="#" onClick="{{goNext}}" aria-label="다음 페이지" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 8px; color: #17201b"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
      </sc-if>
      <sc-if value="{{noNext}}" hint-placeholder-val="{{ false }}">
        <span aria-disabled="true" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #b4bcb7"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span>
      </sc-if>
    </nav>
  </main>

  <footer style="border-top: 1px solid #e3e7e4; padding: 8px 16px 28px; font-size: 13px; line-height: 1.6; color: #5b665f">
    <nav aria-label="사이트 정보" style="display: flex; flex-wrap: wrap; gap: 0 16px; font-size: 13px">
      <a href="MobileAbout.dc.html" style="padding: 12px 0; color: #5b665f">소개</a>
      <a href="#" style="padding: 12px 0; color: #5b665f">개인정보처리방침</a>
      <a href="#" style="padding: 12px 0; color: #5b665f">RSS</a>
    </nav>
    <p style="margin: 0">© 2026 알짜 · 생활·돈·행정 — 알아두면 쓸모있는 정보</p>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"searchOpen":{"editor":"boolean","default":true},"totalPages":{"editor":"int","min":1,"max":30,"step":1,"default":12},"$preview":{"width":390,"height":2070}}'>
class Component extends DCLogic {
  renderVals() {
    const open = (this.state && typeof this.state.open === 'boolean') ? this.state.open : (this.props.searchOpen ?? true);
    const total = this.props.totalPages ?? 12;
    const cur = Math.min((this.state && this.state.page) || 1, total);
    let nums;
    if (total <= 5) nums = Array.from({ length: total }, (_, i) => i + 1);
    else if (cur <= 3) nums = [1, 2, 3, 4, 0, total];
    else if (cur >= total - 2) nums = [1, 0, total - 3, total - 2, total - 1, total];
    else nums = [1, 0, cur, 0, total];
    const go = (n) => (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ page: n }); };
    const pages = nums.map((n) => ({ label: n ? String(n) : '…', isCur: n === cur, isLink: n > 0 && n !== cur, isGap: n === 0, aria: n + '페이지', go: go(n) }));
    return {
      pages: pages, hasPrev: cur > 1, noPrev: cur <= 1, hasNext: cur < total, noNext: cur >= total, goPrev: go(cur - 1), goNext: go(cur + 1),
      searchOpen: open, searchClosed: !open, searchExpanded: open ? 'true' : 'false', searchLabel: open ? '검색 닫기' : '검색 열기', searchBtnBg: open ? '#ecf4ef' : 'transparent', panelRows: open ? '1fr' : '0fr', panelOpacity: open ? '1' : '0', panelVis: open ? 'visible' : 'hidden', toggleSearch: () => this.setState({ open: !open }),
      posts: [
        { date: '2026.10.24', cat: '행정', title: '전입신고, 정부24로 집에서 끝내는 순서', desc: '이사 후 14일 안에 해야 하는 전입신고를 온라인으로 처리하는 방법과 준비물.' },
        { date: '2026.10.21', cat: '돈', title: '연말정산 미리보기, 10월에 확인해야 할 항목', desc: '남은 두 달 동안 조정할 수 있는 공제 항목 점검법.' },
        { date: '2026.10.18', cat: '생활', title: '관리비 고지서 읽는 법: 항목별 의미 정리', desc: '공용관리비, 개별사용료, 장기수선충당금이 각각 무엇인지.' },
        { date: '2026.10.15', cat: '행정', title: '여권 재발급, 온라인 신청이 되는 경우와 안 되는 경우', desc: '재발급 조건별 방문 여부와 수령 방법.' },
        { date: '2026.10.12', cat: '돈', title: '실업급여 신청 순서 한눈에 보기', desc: '이직확인서부터 실업인정일까지 단계별 정리.' },
        { date: '2026.10.09', cat: '생활', title: '이사 체크리스트: 2주 전부터 당일까지', desc: '시기별로 나눈 이사 할 일 목록.' },
        { date: '2026.10.06', cat: '행정', title: '주민등록등본 무료 발급, 어디서 하나', desc: '정부24, 무인민원발급기, 주민센터 방법별 차이.' },
        { date: '2026.10.03', cat: '돈', title: '청년 대상 정책 금융상품 비교하는 기준', desc: '가입 조건, 납입 기간, 중도 해지 조건 비교 순서.' },
        { date: '2026.09.30', cat: '생활', title: '전기요금 고지서에서 누진 구간 확인하는 법', desc: '사용량 구간과 단가를 고지서에서 찾는 위치.' },
        { date: '2026.09.27', cat: '행정', title: '자동차 검사 기간 조회와 예약 방법', desc: '유효기간 확인부터 예약, 지연 시 주의점까지.' }
      ]
    };
  }
}
</script>
</body>
</html>
