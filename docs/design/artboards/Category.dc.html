<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>알짜 카테고리</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
a{color:#17201b;text-decoration:none}
a:hover{color:#0b6e4f}
@media (prefers-reduced-motion: reduce){.search-panel{transition:none !important}}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans KR', system-ui, sans-serif; color: #17201b; background: #ffffff; min-height: 100%; display: flex; flex-direction: column">
  <header style="border-bottom: 1px solid #e3e7e4">
    <div style="max-width: 768px; margin: 0 auto; padding: 0 16px; height: 64px; display: flex; align-items: center; justify-content: center">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px" aria-label="알짜 홈">
        <span style="width: 28px; height: 28px; border-radius: 8px; background: #0b6e4f; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">알</span>
        <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em">알짜</span>
      </a>
    </div>
    <nav aria-label="카테고리" style="border-top: 1px solid #eef1ef">
      <div style="position: relative; max-width: 1200px; margin: 0 auto; padding: 0 64px; box-sizing: border-box">
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 8px">
        <li><a href="Main.dc.html" style="display: block; padding: 12px 14px; font-size: 16px; color: #4a554e">전체</a></li>
        <li><a href="Category.dc.html" style="display: block; padding: 12px 14px; font-size: 16px; color: #4a554e">생활</a></li>
        <li><a href="Category.dc.html" style="display: block; padding: 12px 14px; font-size: 16px; color: #4a554e">돈</a></li>
        <li><a href="Category.dc.html" aria-current="{{catCurrent}}" style="display: block; padding: 12px 14px; font-size: 16px; font-weight: {{catWeight}}; color: {{catColor}}; box-shadow: {{catLine}}">행정</a></li>
      </ul>
      <button type="button" onClick="{{toggleSearch}}" aria-expanded="{{searchExpanded}}" aria-controls="site-search" aria-label="{{searchLabel}}" style="position: absolute; right: 12px; top: 2px; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 8px; background: {{searchBtnBg}}; color: #17201b; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <sc-if value="{{searchClosed}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg></sc-if>
        <sc-if value="{{searchOpen}}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
      </button>
      </div>
    </nav>
    <div id="site-search" class="search-panel" style="display: grid; grid-template-rows: {{panelRows}}; opacity: {{panelOpacity}}; visibility: {{panelVis}}; transition: grid-template-rows 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease, visibility 0.3s">
      <div style="overflow: hidden; min-height: 0">
      <div style="border-top: 1px solid #eef1ef; background: #f6f8f6">
        <div style="max-width: 768px; margin: 0 auto; padding: 16px 16px 14px; box-sizing: border-box">
          <label for="site-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">검색어</label>
          <div style="position: relative">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b665f" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 16px; top: 15px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
            <input id="site-q" type="search" placeholder="검색어를 입력하세요" style="width: 100%; box-sizing: border-box; height: 48px; padding: 0 16px 0 44px; font-family: inherit; font-size: 16px; color: #17201b; border: 1.5px solid #17201b; border-radius: 10px; background: #ffffff">
          </div>
          <p style="margin: 8px 0 0; font-size: 14px; color: #5b665f">Enter를 누르면 검색 결과 페이지로 이동합니다</p>
        </div>
      </div>
      </div>
    </div>
  </header>

  <main style="flex: 1; width: 100%; max-width: 768px; margin: 0 auto; padding: 48px 16px 48px; box-sizing: border-box">
    <p style="margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #0b6e4f">{{label}}</p>
    <h1 style="margin: 0 0 8px; font-size: 36px; line-height: 1.3; font-weight: 700; letter-spacing: -0.025em">{{heading}}</h1>
    <p style="margin: 0 0 32px; font-size: 14px; color: #5b665f">글 {{count}}개 · 최신순</p>

    <ul style="list-style: none; margin: 0; padding: 0; border-top: 1px solid #17201b">
      <sc-for list="{{posts}}" as="p" hint-placeholder-count="5">
        <li style="padding: 24px 0; border-bottom: 1px solid #e3e7e4; display: flex; flex-direction: column; gap: 8px">
          <p style="margin: 0; font-size: 14px; color: #5b665f">{{p.date}}</p>
          <a href="Post.dc.html" style="font-size: 19px; line-height: 1.5; font-weight: 700">{{p.title}}</a>
          <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #4a554e">{{p.desc}}</p>
        </li>
      </sc-for>
    </ul>
  </main>

  <footer style="border-top: 1px solid #e3e7e4">
    <div style="max-width: 768px; margin: 0 auto; padding: 16px 16px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 24px; font-size: 14px; color: #5b665f">
      <p style="margin: 0; padding: 12px 0">© 2026 알짜 · 생활·돈·행정 — 알아두면 쓸모있는 정보</p>
      <nav aria-label="사이트 정보" style="display: flex; gap: 16px">
        <a href="About.dc.html" style="padding: 12px 0; color: #5b665f">소개</a>
        <a href="Privacy.dc.html" style="padding: 12px 0; color: #5b665f">개인정보처리방침</a>
        <a href="#" style="padding: 12px 0; color: #5b665f">RSS</a>
      </nav>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["카테고리","태그"],"default":"카테고리"},"$preview":{"width":1280,"height":1140}}'>
class Component extends DCLogic {
  renderVals() {
    const tag = (this.props.mode ?? '카테고리') === '태그';
    const open = !!(this.state && this.state.open);
    const posts = [
      { date: '2026.10.24', title: '전입신고, 정부24로 집에서 끝내는 순서', desc: '이사 후 14일 안에 해야 하는 전입신고를 온라인으로 처리하는 방법과 준비물, 자주 막히는 지점을 정리했습니다.' },
      { date: '2026.10.15', title: '여권 재발급, 온라인 신청이 되는 경우와 안 되는 경우', desc: '재발급 조건에 따라 방문이 필요한지, 수령은 어떻게 하는지 정리했습니다.' },
      { date: '2026.10.06', title: '주민등록등본 무료 발급, 어디서 하나', desc: '정부24, 무인민원발급기, 주민센터 방법별 차이와 준비물.' },
      { date: '2026.09.27', title: '자동차 검사 기간 조회와 예약 방법', desc: '검사 유효기간 확인부터 예약, 지연 시 주의할 점까지.' }
    ];
    return {
      label: tag ? '태그' : '카테고리',
      heading: tag ? '#이사' : '행정',
      count: posts.length,
      posts: posts,
      catCurrent: tag ? 'false' : 'page',
      catWeight: tag ? '400' : '700',
      catColor: tag ? '#4a554e' : '#0b6e4f',
      catLine: tag ? 'none' : 'inset 0 -2px 0 #0b6e4f',
      searchOpen: open, searchClosed: !open, searchExpanded: open ? 'true' : 'false', searchLabel: open ? '검색 닫기' : '검색 열기', searchBtnBg: open ? '#ecf4ef' : 'transparent', panelRows: open ? '1fr' : '0fr', panelOpacity: open ? '1' : '0', panelVis: open ? 'visible' : 'hidden', toggleSearch: () => this.setState({ open: !open })
    };
  }
}
</script>
</body>
</html>
